name: Auto Post Trending News

on:
  schedule:
    # Times are in UTC. IST = UTC + 5:30. These correspond to
    # 7,9,11,13,15,17,19,21,22,23 IST - 10 posts spread through the day.
    - cron: "30 1 * * *"
    - cron: "30 3 * * *"
    - cron: "30 5 * * *"
    - cron: "30 7 * * *"
    - cron: "30 9 * * *"
    - cron: "30 11 * * *"
    - cron: "30 13 * * *"
    - cron: "30 15 * * *"
    - cron: "30 16 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch: {}

# Only one run at a time - if a scheduled run and a manual run overlap, the
# newer one waits instead of racing the older one for the same git push.
concurrency:
  group: news-bot-posting
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Run the bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: npm start

      - name: Save posting history back to repo
        run: |
          git config --global user.name "fb-news-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add state/posted.json
          git diff --staged --quiet || git commit -m "Update posted news history"
          git pull --rebase --autostash origin main
          git push
